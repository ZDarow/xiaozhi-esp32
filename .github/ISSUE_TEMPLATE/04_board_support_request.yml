name: Запрос поддержки платы
description: Попросить поддержку новой платы, продукта, аппаратной ревизии или SKU
title: "[Board Support] "
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Похожие продукты могут использовать разные пины и компоненты. Укажите точное оборудование, а не только название ближайшей поддерживаемой платы.

  - type: checkboxes
    id: checklist
    attributes:
      label: Перед отправкой
      options:
        - label: Я поискал в репозитории и существующих issues эту точную модель и аппаратную ревизию.
          required: true

  - type: textarea
    id: hardware
    attributes:
      label: Точное оборудование
      description: Укажите производителя, модель, ревизию/SKU, основной чип и память, а также официальную ссылку на продукт или документацию.
      placeholder: |
        Производитель и модель:
        Ревизия или SKU:
        Чип, flash и PSRAM:
        Официальная ссылка:
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: Запрашиваемая поддержка
      description: Опишите, что должно работать, и любые известные различия с ближайшей поддерживаемой платой.
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: Что вы пробовали?
      description: Включите ближайшую целевую плату или прошивку, её версию и результат. Введите "None", если нет подходящей существующей цели.
    validations:
      required: true

  - type: dropdown
    id: testing
    attributes:
      label: Тестирование доступно
      options:
        - Я могу собрать, прошить, собрать логи и тестировать изменения
        - Я могу прошить бинарники и тестировать изменения
        - Я могу предоставить только информацию об оборудовании
        - Я не могу тестировать изменения
    validations:
      required: true

  - type: upload
    id: attachments
    attributes:
      label: Дополнительные аппаратные файлы, фото или логи
      description: Прикрепите публичные схемы, фото платы, распиновки или последовательные логи. Не загружайте конфиденциальные материалы или секреты.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.pdf,.log,.txt,.json,.zip"