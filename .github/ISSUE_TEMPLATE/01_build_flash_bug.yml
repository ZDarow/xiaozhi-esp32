name: Проблема сборки, настройки или прошивки
description: Сообщить о воспроизводимой проблеме при настройке, сборке или прошивке
title: "[Build] "
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Эта форма предназначена для открытой прошивки. Для отвязки устройства отправьте личное письмо на [support@xiaozhi.ru](mailto:support@xiaozhi.ru?subject=Device%20unbinding%20request) с идентификатором устройства и MAC-адресом. Для других запросов аккаунта и облачных сервисов пишите на [support@xiaozhi.ru](mailto:support@xiaozhi.ru?subject=Cloud%20services%20request).

  - type: checkboxes
    id: checklist
    attributes:
      label: Перед отправкой
      options:
        - label: Я проверил текущую версию исходного кода и поискал существующие issues с той же проблемой.
          required: true

  - type: input
    id: board
    attributes:
      label: Плата или устройство
      description: Укажите физическую модель/продукт и выбранную целевую плату или вариант сборки.
      placeholder: ex. Waveshare ESP32-S3-Touch-LCD-3.5B; target waveshare/esp32-s3-touch-lcd-3.5b
    validations:
      required: true

  - type: input
    id: source_version
    attributes:
      label: Версия исходного кода XiaoZhi
      description: Вставьте полный вывод `git describe --tags --always --dirty`. Не вводите "latest".
      placeholder: ex. v2.2.6-15-g1a2b3c4
    validations:
      required: true

  - type: input
    id: esp_idf_version
    attributes:
      label: Версия ESP-IDF
      description: Вставьте полный вывод `idf.py --version`.
      placeholder: ex. ESP-IDF v6.0.2
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Проблема и шаги воспроизведения
      description: Опишите, что вы пробовали, точные команды или шаги, чего ожидали, что произошло и любые локальные изменения.
      placeholder: |
        ОС:
        Команда или шаги:
        Ожидаемый результат:
        Фактический результат:
        Локальные изменения, если есть:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Полный вывод ошибки
      description: Вставьте вывод от первой ошибки до конечного сбоя. Удалите учётные данные, токены, имена пользователей и другую личную информацию.
      placeholder: Вставьте здесь полный вывод, а не только последнюю строку ошибки.
      render: shell
    validations:
      required: true

  - type: upload
    id: attachments
    attributes:
      label: Дополнительные файлы
      description: Прикрепите логи или ZIP с соответствующими конфигурационными файлами. Сначала проверьте файлы на наличие секретов.
    validations:
      required: false
      accept: ".log,.txt,.json,.zip"