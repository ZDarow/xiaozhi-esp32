name: Ошибка во время выполнения устройства
description: Сообщить о воспроизводимой проблеме прошивки во время работы устройства
title: "[Bug] "
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Эта форма предназначена для открытой прошивки устройства. Для отвязки устройства отправьте личное письмо на [support@xiaozhi.ru](mailto:support@xiaozhi.ru?subject=Device%20unbinding%20request) с идентификатором устройства и MAC-адресом. Для других запросов аккаунта и облачных сервисов пишите на [support@xiaozhi.ru](mailto:support@xiaozhi.ru?subject=Cloud%20services%20request).

  - type: checkboxes
    id: checklist
    attributes:
      label: Перед отправкой
      options:
        - label: Я проверил последнюю применимую прошивку и поискал существующие issues с той же проблемой.
          required: true

  - type: input
    id: device
    attributes:
      label: Устройство или плата разработки
      description: Укажите производителя, точную модель/продукт, аппаратную ревизию или SKU при наличии.
      placeholder: ex. LilyGO T-Circle-S3 V1.1 или EchoEar N16R8
    validations:
      required: true

  - type: input
    id: firmware_version
    attributes:
      label: Версия прошивки
      description: Вставьте значение `App version:` из журнала загрузки. Не вводите название платы или "latest".
      placeholder: ex. 2.2.6
    validations:
      required: true

  - type: input
    id: firmware_source
    attributes:
      label: Источник или имя файла прошивки
      description: Укажите, откуда взята прошивка, и включите имя файла или целевую плату при наличии.
      placeholder: ex. 2.5.0, GitHub release echoear.bin, self-built target df-k10, или vendor firmware
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Проблема и шаги воспроизведения
      description: Опишите начальное состояние, точные действия, ожидаемый результат, фактический результат, частоту и любые модификации.
      placeholder: |
        Шаги:
        Ожидаемый результат:
        Фактический результат:
        Частота:
        Модификации, если есть:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Логи или другие доказательства
      description: Вставьте соответствующие логи загрузки и сбоев, включая backtrace или причину сброса при необходимости. Если логи недоступны, кратко объясните почему. Удалите учётные данные, идентификаторы устройств, MAC-адреса, UUID и другую личную информацию.
      placeholder: Вставьте здесь соответствующие логи, или объясните, почему логи нельзя собрать.
      render: shell
    validations:
      required: true

  - type: upload
    id: attachments
    attributes:
      label: Дополнительные фото, видео или файлы логов
      description: Прикрепите файлы, которые помогут идентифицировать оборудование или продемонстрировать сбой. Сначала проверьте файлы на наличие личной информации.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.mp4,.mov,.webm,.log,.txt,.zip"