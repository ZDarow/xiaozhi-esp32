name: Запрос функции
description: Предложить улучшение для поддерживаемого устройства или общей прошивки
title: "[Feature] "
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Используйте форму **Запрос поддержки платы** для новой платы, аппаратной ревизии или продуктового варианта. Запросы аккаунта и облачных продуктов отправляйте на [support@xiaozhi.ru](mailto:support@xiaozhi.ru?subject=Cloud%20services%20request).

  - type: checkboxes
    id: checklist
    attributes:
      label: Перед отправкой
      options:
        - label: Я поискал существующие запросы функций и не нашёл такого же предложения.
          required: true

  - type: input
    id: scope
    attributes:
      label: Затронутое устройство или область
      description: Укажите устройство, целевую плату или область прошивки. Введите "All devices" для общего запроса.
      placeholder: ex. df-k10, audio, display, protocol, или All devices
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Проблема или вариант использования
      description: Объясните текущее ограничение и почему запрошенное изменение будет полезно.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Запрашиваемое поведение
      description: Опишите результат или поведение, которое вы хотели бы увидеть.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Дополнительный контекст
      description: По желанию добавьте альтернативы, скриншоты, диаграммы, ссылки или информацию о тестировании.
    validations:
      required: false