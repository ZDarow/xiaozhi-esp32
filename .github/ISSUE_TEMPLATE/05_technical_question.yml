name: Вопрос по разработке прошивки
description: Задать сфокусированный технический вопрос об этом репозитории или поддерживаемом оборудовании
title: "[Question] "
labels: ['question']
body:
  - type: markdown
    attributes:
      value: |
        Эта форма предназначена для технических вопросов об открытой прошивке. Для отвязки устройства отправьте личное письмо на [support@xiaozhi.ru](mailto:support@xiaozhi.ru?subject=Device%20unbinding%20request) с идентификатором устройства и MAC-адресом. Другие запросы аккаунта и облачных сервисов отправляйте на [веб-сайт XiaoZhi AI](https://xiaozhi.me/).

  - type: checkboxes
    id: checklist
    attributes:
      label: Перед отправкой
      options:
        - label: Я поискал в репозитории и существующих issues и не нашёл ответа.
          required: true

  - type: input
    id: context
    attributes:
      label: Релевантное устройство, версия или область кода
      description: Укажите устройство/модель, целевую плату, источник или версию прошивки, файл или подсистему, которые важны для вопроса.
      placeholder: ex. zhengchen-cam на v2.2.6, или main/audio на текущей main
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Цель и вопрос
      description: Объясните, чего вы хотите достичь, и сформулируйте конкретный технический вопрос.
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: Что вы пробовали?
      description: По желанию включите релевантные файлы, команды, эксперименты, логи, скриншоты или минимальный пример.
    validations:
      required: false