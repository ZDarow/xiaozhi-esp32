---
name: Build Boards

"on":
  push:
    branches:
      - main
      - ci/*  # для CI-тестов
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test build tooling
        run: python -m unittest discover -s scripts/tests -v

      - name: Check code formatting
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="HEAD^1"
            HEAD_REF="HEAD^2"
          else
            BEFORE="${{ github.event.before }}"
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              echo "No previous revision for the first push; " \
                   "skipping formatting diff."
              exit 0
            fi
            BASE_REF="$BEFORE"
            HEAD_REF="${{ github.sha }}"
          fi

          git diff --unified=0 "$BASE_REF" "$HEAD_REF" \
            -- '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' > /tmp/code-format.diff

          if [[ ! -s /tmp/code-format.diff ]]; then
            exit 0
          fi

          if command -v clang-format-diff-18 >/dev/null 2>&1; then
            FORMAT_DIFF_BIN="clang-format-diff-18"
          elif command -v clang-format-diff >/dev/null 2>&1; then
            FORMAT_DIFF_BIN="clang-format-diff"
          else
            echo "clang-format-diff is required for formatting checks."
            exit 1
          fi

          "$FORMAT_DIFF_BIN" -p1 -style=file < /tmp/code-format.diff \
            > /tmp/code-format.patch
          if [[ -s /tmp/code-format.patch ]]; then
            cat /tmp/code-format.patch
            exit 1
          fi

      - name: Lint YAML files
        run: |
          pip install yamllint
          yamllint .github/workflows/*.yml

      - id: select
        name: Select variants based on changes
        shell: bash
        run: |
          EVENT_NAME="${{ github.event_name }}"

          # push 到 main 分支，编译全部变体
          if [[ "$EVENT_NAME" == "push" ]]; then
            # Keep the full matrix out of an environment variable. A single
            # Linux environment entry is limited to 128 KiB, and the variant
            # JSON can exceed that as boards are added.
            {
              printf 'variants='
              python scripts/build.py --list-boards --json
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # pull_request 场景
          # actions/checkout checks out GitHub's synthetic PR merge commit. Its
          # first and second parents are the exact base and head commits used
          # for this run, even when the event SHAs are not exposed as refs in
          # the job container.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE_SHA="HEAD^1"
          HEAD_SHA="HEAD^2"
          echo "Base: $(git rev-parse "$BASE_SHA"), " \
               "Head: $(git rev-parse "$HEAD_SHA")"

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo -e "Changed files:\n$CHANGED"

          SELECTED=$(
            printf '%s\n' "$CHANGED" |
              python scripts/build.py --select-changed
          )
          echo "variants=$SELECTED" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.full_name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false  # 单个变体失败不影响其它变体
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build current variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py ${{ matrix.board }} --name ${{ matrix.name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_${{ matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
